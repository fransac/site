<h1>Snake</h1>
<p>
	I decided to make a simple snake game in JavaScript. Why? Because I had
	too much free time and wanted to test my sanity.
</p>
<p>
	The snake is controlled by the WASD keys. If you are on mobile or
	don't have a keyboard, I'm sorry for you.
</p>
<noscript><p>
	If you can't see the game down here, it probably means that you have
	JavaScript disabled. Do yourself a favour and keep it like that ^^.
</p></noscript>
<p id="canvas-p"><canvas id="canvas"></canvas></p>
<script>
/* ID given by setInterval. */
let update_interval = null;

/* The game runs on a grid of pixels of width WIDTH and height HEIGHT. */
const WIDTH = 40;
const HEIGHT = 20;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.style.borderStyle = "solid";

/* Whether the update function is running. */
updating = false;

/* Queue of the coordinates of each pixel occupied by the snake; the first
   element is its head. */
const snake = [[0, 0]];

/* The coordinates of the apple. Initialized on the first update call. */
let apple = null;

/* The direction chosen by the user. 0 means up, 1 means right, 2 means down and
   3 means left. */
let chosen_direction = 1;

/* The final direction the snake will take. The same description of
   chosen_direction applies here. This changed to be chosen_direction on every
   update. */
let direction = 1;

/* Draw pixel with a specific hex color string. If color is null, the pixel is
   instead erased. The coordinates are 0-based. */
function draw_pixel(x, y, color) {
	const pixel_size = canvas.width / WIDTH;

	if (!color) {
		ctx.clearRect(pixel_size * x, pixel_size * y,
		              pixel_size, pixel_size);
		return;
	}

	ctx.fillStyle = color;
	ctx.fillRect(pixel_size * x, pixel_size * y, pixel_size, pixel_size);
}

/* Lose. */
function lose() {
	const bq = document.createElement("blockquote");
	const canvas_p = document.getElementById("canvas-p");

	clearInterval(update_interval);

	bq.textContent = `You lost! Your snake had a size of ${snake.length}.`
	               + " Reload the page to replay.";
	canvas_p.parentNode.insertBefore(bq, canvas_p);
}

/* Return random coordinates, excluding the ones occupied by the snake, */
function random_free_pixel() {
	let p;

	/* Regenerate p until no value of snake has the same coordinates. This
	   may be extremely inefficient if the snake is long. */
	do
		p = [
			Math.floor(Math.random() * WIDTH),
			Math.floor(Math.random() * HEIGHT),
		];
	while (snake.some(([x, y, direction]) => x === p[0] && y === p[1]))

	return p;
}

function update() {
	let head_pointed, tail;

	/* Wait if updating is set. Though it is most likely completely useless,
	   I still like to keep it. */
	while (updating);

	updating = true;

	/* Finalize chosen direction. */
	direction = chosen_direction;

	/* Compute the pixel pointed by head, based on the chosen direction. */
	switch(direction) {
		case 0:
			head_pointed = [snake[0][0], snake[0][1] - 1];
			break;
		case 1:
			head_pointed = [snake[0][0] + 1, snake[0][1]];
			break;
		case 2:
			head_pointed = [snake[0][0], snake[0][1] + 1];
			break;
		case 3:
			head_pointed = [snake[0][0] - 1, snake[0][1]];
			break;
		default:
			break;
	}

	/* 0. Window resizing. */

	canvas.width = canvas.parentNode.clientWidth / 2;
	canvas.height = canvas.width * (HEIGHT / WIDTH);

	/* 1. Loss detection. */

	/* Walls. */
	if (head_pointed[0] < 0 || head_pointed[0] >= WIDTH
	 || head_pointed[1] < 0 || head_pointed[1] >= HEIGHT) {
		lose();
		return;
	}

	/* Snake body, excluding the tail. */
	for (const [x, y, direction] of snake.slice(0, -1)) {
		if (head_pointed[0] === x && head_pointed[1] === y) {
			lose();
			return;
		}
	}

	/* 2. Eating detection. */

	/* If apple is not yet initialized, generate it. Otherwise, if the head
	   is pointing to it, save tail to enqueue it after the snake moves and
	   regenerate the apple. */
	if (!apple) {
		apple = random_free_pixel();
	} else if (head_pointed[0] == apple[0] && head_pointed[1] == apple[1]) {
		tail = snake[snake.length - 1];
		apple = random_free_pixel();
	}

	/* 3. Movement */

	/* Excluding head, make every snake pixel the next one. */
	for (let i = snake.length - 1; i > 0; i--)
		snake[i] = snake[i - 1];

	/* Move head to its pointed pixel. */
	snake[0] = head_pointed;

	/* If tail has been set, enqueue it. */
	if (tail)
		snake.push(tail);

	/* Print debug message. */
	console.clear();
	console.debug(snake);

	/* 4. Draw */

	/* Clear canvas. */
	ctx.clearRect(0, 0, canvas.width, canvas.height);

	/* Draw apple. */
	draw_pixel(apple[0], apple[1], "#4fd970");

	/* Draw snake. */
	for (const [x, y] of snake)
		draw_pixel(x, y, "#ffffff");

	/* 5. Exit the function. */

	updating = false;
}

/* Update snake head direction when WASD keys are pressed. Do not change the
   direction if the chosen one is the opposite of the current one. */
document.onkeydown = e => {
	if (updating)
		return;

	if (e.keyCode === 65 && direction != 1)
		chosen_direction = 3; /* A: Left */
	else if (e.keyCode === 87 && direction != 2)
		chosen_direction = 0; /* W: Up */
	else if (e.keyCode === 68 && direction != 3)
		chosen_direction = 1; /* D: Right */
	else if (e.keyCode === 83 && direction != 0)
		chosen_direction = 2; /* S: Down */
}

update_interval = setInterval(update, 200);
</script>

<h1>Snake</h1>
<p>
	I decided to make a simple snake game in JavaScript. Why? Because I had
	too much free time.
</p>
<noscript><p>
	If you can't see the game down here, it probably means that you have
	JavaScript disabled. Do yourself a favour and keep it like that ^^.
</p></noscript>
<p id="canvas-p"><canvas id="canvas"></canvas></p>
<script>
/* ID given by setInterval. */
let update_interval = null;

/* The game runs on a grid of pixels of width WIDTH and height HEIGHT. */
const WIDTH = 20;
const HEIGHT = 15;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

/* Queue of 3-tuples of ints. The first 2 ints of each element are the
   coordinates of a pixel occupied by the snake; the first element is its head.
   The third int of each element is the direction the pixel will move to on
   update; 0 means up, 1 means right, 2 means down and 3 means left. */
const snake = [[0, 0, 1]];

/* Draw pixel with a specific hex color string. If color is null, the pixel is
   instead erased. The coordinates are 0-based. */
function draw_pixel(x, y, color) {
	const pixel_size = canvas.width / WIDTH;

	if (!color) {
		ctx.clearRect(pixel_size * x, pixel_size * y,
		              pixel_size, pixel_size);
		return;
	}

	ctx.fillStyle = color;
	ctx.rect(pixel_size * x, pixel_size * y, pixel_size, pixel_size);
	ctx.fill();
}

/* Lose. */
function lose() {
	const bq = document.createElement('blockquote');
	const canvas_p = document.getElementById('canvas-p');

	clearInterval(update_interval);

	bq.textContent = `You lost! Your snake had a size of ${snake.length}.`;
	canvas_p.parentNode.insertBefore(bq, canvas_p);
}

/* Based on the x and y coordinate and the direction of the pixel, get the x and
   y pair of the pointed adjacent pixel. */
function pointed_pixel([x, y, direction]) {
	switch (direction) {
		case 0:
			return [x, y - 1];
		case 1:
			return [x + 1, y];
		case 2:
			return [x, y + 1];
		case 3:
			return [x - 1, y];
		default:
			/* Unreachable. Hopefully the user does not mess with
			   this awesome incredible dynamically typed interpreted
			   language. */
			return null;
	}
}

function update() {
	const head_pointed = pointed_pixel(snake[0]);

	/* 0. Window resizing. */

	canvas.width = canvas.parentNode.clientWidth;
	canvas.height = canvas.width * (HEIGHT / WIDTH);

	/* 1. Loss detection. */

	/* Walls. */
	if (head_pointed[0] < 0 || head_pointed[0] >= WIDTH
	 || head_pointed[1] < 0 || head_pointed[1] >= HEIGHT)
		lose();

	/* Snake body, excluding the tail. */
	for (const [x, y, direction] of snake.slice(0, -1))
		if (head_pointed[0] === x && head_pointed[1] === y)
			lose();
}

/* Update snake head direction when arrow keys are pressed. */
document.onkeydown = e => {
	switch (e.keyCode) {
		case 37: /* Left. */
			snake[0][2] = 3;
			break;
		case 38: /* Up. */
			snake[0][2] = 0;
			break;
		case 39: /* Right. */
			snake[0][2] = 1;
			break;
		case 40: /* Down. */
			snake[0][2] = 2;
			break;
		default:
			break;
	}
}

update_interval = setInterval(update, 500);
</script>
